<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>사볼까? | 상품번호 검색</title>

<!-- Supabase SDK 추가 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // Supabase 정보
  const SUPABASE_URL = 'https://ukjfsortwjcyijswdhbs.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_9CN5IP0P0gJuSJh1WTDJNg_-YCcA2tc';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
</script>

<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#171717;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
header{background:#171717;color:white;padding:38px 18px 30px}header .logo{font-size:34px;font-weight:900;letter-spacing:-1.5px}header p{color:#ccc;margin:7px 0 20px;font-size:14px}
.search{display:flex;gap:8px;max-width:520px;margin:auto}.search input{min-width:0;flex:1;border:0;border-radius:10px;padding:15px;font-size:16px}.search button,.buy{border:0;background:#e51d35;color:white;font-weight:800;border-radius:10px;padding:0 20px;cursor:pointer}
main{max-width:760px;margin:24px auto;padding:0 16px}.hint{font-size:13px;color:#666;text-align:center;margin:12px 0 24px}
.section-title{font-size:18px;font-weight:800;margin:24px 0 14px;color:#171717;display:flex;justify-content:space-between;align-items:center}
.result-list{display:flex;flex-direction:column;gap:12px}
.result{background:white;border:1px solid #eee;border-radius:16px;padding:14px;display:flex;gap:15px;align-items:center;width:100%;box-shadow:0 3px 14px #0000000a}
.pic{width:120px;height:120px;flex-shrink:0;border-radius:12px;background:#f1f1f1;display:grid;place-items:center;color:#999;font-size:13px;text-align:center;padding:8px}
.meta{flex:1;min-width:0}.num{font-size:12px;color:#e51d35;font-weight:800}.name{font-size:18px;font-weight:800;margin:5px 0}.desc{font-size:13px;color:#666;margin-bottom:12px}.buy{display:inline-block;text-decoration:none;padding:11px 15px;font-size:14px}
#message{text-align:center;color:#666;margin:26px 0;font-size:14px}.foot{text-align:center;color:#888;font-size:11px;margin:35px 0}
.reset-btn{font-size:12px;background:none;border:none;color:#666;text-decoration:underline;cursor:pointer;padding:0}
@media(max-width:420px){.result{gap:11px}.pic{width:100px;height:100px}.name{font-size:16px}.buy{padding:10px 11px}}
</style>
</head>
<body>
<header>
  <div class="logo">🛒 사볼까?</div>
  <p>숏폼 속 상품을 번호로 찾아보세요!</p>
  <form class="search" id="search">
    <input id="number" inputmode="numeric" placeholder="상품번호 입력 (예: 001)" aria-label="상품번호">
    <button>검색</button>
  </form>
</header>

<main>
  <div class="hint">영상에 표시된 상품번호를 입력하거나 아래 목록에서 클릭하세요.</div>
  
  <div class="section-title">
    <span id="listTitle">전체 상품 목록</span>
    <button type="button" id="resetBtn" class="reset-btn" style="display:none;" onclick="loadAllProducts()">전체 보기</button>
  </div>
  
  <div id="results" class="result-list"></div>
  
  <div class="foot">일부 링크는 제휴 링크이며, 구매 시 수수료를 받을 수 있습니다.</div>
</main>

<script>
const form = document.querySelector("#search"), 
      input = document.querySelector("#number"), 
      out = document.querySelector("#results"),
      listTitle = document.querySelector("#listTitle"),
      resetBtn = document.querySelector("#resetBtn");

// 단일 상품 카드 HTML 생성 함수
function renderProductCard(p) {
  const img = p.image_url 
    ? `<img src="${p.image_url}" alt="${p.product_name || ''}" style="width:100%;height:100%;object-fit:cover;border-radius:12px">` 
    : "상품 사진";
    
  const link = p.affiliate_url 
    ? `<a class="buy" href="${p.affiliate_url}" target="_blank" rel="noopener noreferrer">상품 구매하기 ↗</a>` 
    : '<span style="font-size:12px;color:#b45309">구매 링크 준비 중</span>';

  return `
    <article class="result">
      <div class="pic">${img}</div>
      <div class="meta">
        <div class="num">상품번호 ${p.product_no}</div>
        <div class="name">${p.product_name || ''}</div>
        <div class="desc">${p.description || ''}</div>
        ${link}
      </div>
    </article>
  `;
}

// 1. 초기 진입 시 전체 상품 목록 로드
async function loadAllProducts() {
  input.value = "";
  listTitle.textContent = "전체 상품 목록";
  resetBtn.style.display = "none";
  out.innerHTML = '<div id="message">상품 목록을 불러오는 중...</div>';

  try {
    const { data: products, error } = await supabaseClient
      .from('products')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) throw error;

    if (!products || products.length === 0) {
      out.innerHTML = '<div id="message">등록된 상품이 없습니다.</div>';
      return;
    }

    out.innerHTML = products.map(p => renderProductCard(p)).join('');
  } catch (err) {
    console.error(err);
    out.innerHTML = '<div id="message">상품 목록을 불러오는 중 오류가 발생했습니다.</div>';
  }
}

// 2. 검색 기능
async function search(e) {
  if (e) e.preventDefault();
  
  const id = input.value.trim().replace(/^#/, "").padStart(3, "0");
  if (!id) {
    loadAllProducts();
    return;
  }

  out.innerHTML = '<div id="message">검색 결과를 불러오는 중...</div>';

  try {
    const { data: products, error } = await supabaseClient
      .from('products')
      .select('*')
      .eq('product_no', id);

    if (error) throw error;

    if (!products || products.length === 0) {
      out.innerHTML = '<div id="message">해당 상품번호를 찾을 수 없습니다.<br>번호를 다시 확인해 주세요.</div>';
      listTitle.textContent = "검색 결과";
      resetBtn.style.display = "inline";
      return;
    }

    listTitle.textContent = `검색 결과 (No. ${id})`;
    resetBtn.style.display = "inline";
    out.innerHTML = renderProductCard(products[0]);
  } catch (err) {
    console.error(err);
    out.innerHTML = '<div id="message">조회 중 오류가 발생했습니다.</div>';
  }
}

// 페이지 로드 시 바로 전체 목록 표시
window.addEventListener("DOMContentLoaded", loadAllProducts);
form.addEventListener("submit", search);
</script>
</body>
</html>
