<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>사볼까? | 상품번호 검색</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#171717;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
header{background:#171717;color:white;text-align:center;padding:38px 18px 30px}header .logo{font-size:34px;font-weight:900;letter-spacing:-1.5px}header p{color:#ccc;margin:7px 0 20px;font-size:14px}
.search{display:flex;gap:8px;max-width:520px;margin:auto}.search input{min-width:0;flex:1;border:0;border-radius:10px;padding:15px;font-size:16px}.search button,.buy{border:0;background:#e51d35;color:white;font-weight:800;border-radius:10px;padding:0 20px;cursor:pointer}
main{max-width:760px;margin:24px auto;padding:0 16px}.hint{font-size:13px;color:#666;text-align:center;margin:12px 0 24px}
.result{background:white;border:1px solid #eee;border-radius:16px;padding:14px;display:flex;gap:15px;align-items:center;max-width:560px;margin:0 auto;box-shadow:0 3px 14px #0000000a}
.pic{width:120px;height:120px;flex-shrink:0;border-radius:12px;background:#f1f1f1;display:grid;place-items:center;color:#999;font-size:13px;text-align:center;padding:8px}
.meta{flex:1;min-width:0}.num{font-size:12px;color:#e51d35;font-weight:800}.name{font-size:18px;font-weight:800;margin:5px 0}.desc{font-size:13px;color:#666;margin-bottom:12px}.buy{display:inline-block;text-decoration:none;padding:11px 15px;font-size:14px}
#message{text-align:center;color:#666;margin:26px 0;font-size:14px}.foot{text-align:center;color:#888;font-size:11px;margin:35px 0}
@media(max-width:420px){.result{gap:11px}.pic{width:100px;height:100px}.name{font-size:16px}.buy{padding:10px 11px}}
</style>
</head>
<body>
<header><div class="logo">🛒 사볼까?</div><p>숏폼 속 상품을 번호로 찾아보세요!</p>
<form class="search" id="search"><input id="number" inputmode="numeric" placeholder="상품번호 입력 (예: 001)" aria-label="상품번호"><button>검색</button></form></header>
<main><div class="hint">영상에 표시된 상품번호를 입력하면 구매 링크를 확인할 수 있어요.</div><div id="results"></div><div class="foot">일부 링크는 제휴 링크이며, 구매 시 수수료를 받을 수 있습니다.</div></main>
<script>
/* 상품을 추가할 때 아래 목록을 복사해 수정하세요.
   id는 중복되지 않게, link에는 본인의 쇼핑커넥트 전용 링크를 입력하세요. */
const products = [
 {id:"001",name:"상품명 입력",description:"상품 설명 입력",image:"",link:""},
 {id:"002",name:"상품명 입력",description:"상품 설명 입력",image:"",link:""}
];
const form=document.querySelector("#search"), input=document.querySelector("#number"), out=document.querySelector("#results");
function search(e){if(e)e.preventDefault();const id=input.value.trim().replace(/^#/,"").padStart(3,"0");const p=products.find(x=>x.id===id);
 if(!id||!p){out.innerHTML='<div id="message">해당 상품번호를 찾을 수 없습니다.<br>번호를 다시 확인해 주세요.</div>';return}
 const img=p.image?`<img src="${p.image}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:12px">`:"상품 사진";
 const link=p.link?`<a class="buy" href="${p.link}" target="_blank" rel="noopener noreferrer">상품 구매하기 ↗</a>`:"<span style='font-size:12px;color:#b45309'>구매 링크 준비 중</span>";
 out.innerHTML=`<article class="result"><div class="pic">${img}</div><div class="meta"><div class="num">상품번호 ${p.id}</div><div class="name"></div><div class="desc"></div>${link}</div></article>`;
 out.querySelector(".name").textContent=p.name;out.querySelector(".desc").textContent=p.description;
}
form.addEventListener("submit",search);
</script></body></html>
